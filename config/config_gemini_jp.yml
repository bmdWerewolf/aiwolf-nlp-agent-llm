web_socket:
  url: ws://133.167.32.100:8009/ws
  token:
  auto_reconnect: false

rules:
  max_chars: 50

agent:
  num: 9
  team: bmd
  kill_on_timeout: true

llm:
  type: openai
  sleep_time: 5
  max_retries: 3

# Chain of Thought (思考の連鎖) 設定
cot:
  enabled: true

# 記憶管理設定
memory:
  type: 0
  rolling_summary:
    buffer_size: 5
  game_state:
    suspicion_decay: 0.1
  belief_reflexion:
    reflexion_interval: 1

skills:
  enabled: true
  base_dir: ./config/skills/ja
  fallback_to_builtin_strategy: true
  files:
    WEREWOLF: werewolf.md
    VILLAGER: villager.md
    SEER: seer.md
    MEDIUM: medium.md
    BODYGUARD: bodyguard.md
    POSSESSED: possessed.md

turn_skills:
  enabled: true
  base_dir: ./config/skills/ja/psychology
  requests:
    - TALK
    - WHISPER
  max_chars: 1200
  files:
    being_suspected: being_suspected.md
    vote_pressure: vote_pressure.md
    heated_conflict: heated_conflict.md
    trust_recovery: trust_recovery.md
  summaries:
    being_suspected: 自分が疑われている場面での防御と信頼回復
    vote_pressure: 投票先の明言を迫られる場面での意思決定
    heated_conflict: 議論が感情的に荒れている場面での主導
    trust_recovery: 自分の発言矛盾や不信を修復する場面

openai:
  model: gpt-5.4
  temperature: 0.7
  base_url: https://openrouter.ai/api/v1
  # max_tokens: 2048

google:
  model: gemini-2.5-flash-lite
  temperature: 0.7

ollama:
  model: qwen2.5:72b
  temperature: 0.7
  base_url: http://127.0.0.1:11434

prompt:
  system: |-
    # 1. 基本ルール設定
    あなたは人狼ゲーム（汝は人狼なりや？）のデジタル対戦をプレイしています。

    役職:
    - 人狼 2, 狂人 1 (人狼陣営), 占い師 1, 霊媒師 1, 騎士 1, 村人 3 (村人陣営)
    - 狂人は占われても白と出る。人狼陣営だが襲撃能力はない。

    ゲームの流れ:
    - 夜: 人狼が襲撃します。占い師は一人を占います。霊媒師は処刑された人が人狼かどうかを知ります。騎士は一人を護衛します。狂人は夜のアクションを持ちません。
    - 昼: 各エージェントがランダムな順序で1度ずつ発話し、一人を処刑（追放）するために投票します。

    勝利条件:
    - 村人陣営: すべての人狼を処刑すれば勝利。
    - 人狼陣営: 生存者の半数が人狼陣営になれば勝利。

    ゲーム参加者:
    {% for k, v in info.status_map.items() if v == 'ALIVE'%}
    - {{ k }}
    {% endfor %}

    # 2. あなたのアイデンティティ
    名前: {{ info.agent }}
    役職: {{ role.value }}
    性格・背景: {{ info.profile }}
    出力する語尾や口調は性格を表したものにしてください。

    {% if use_builtin_role_strategy %}
    # 3. 戦略ガイドライン ({{ role.value }})
    {% if role.value == 'WEREWOLF' -%}
    - 村人たちを混乱や疑心暗鬼に陥れるよう、巧みに誘導してください。
    - 仲間の人狼と囁きで連携してください。
    {% elif role.value == 'SEER' -%}
    - 占い結果は{{ max_chars }}文字以内で「結果＋占い先を選んだ理由」を簡潔に表明してください。例：「占いCO。ユミ白。便乗が気になった。」
    - 対抗占いが出た場合は「投票軌跡・主張変遷・判定矛盾」の3点で比較し、感情論を避けて真偽を主張してください。
    - 自分が吊られそうな時は、吊られると村の損失になる理由を短く主張してください。
    - 投票を呼びかける際は自分の白対象に名指しで協力を求めること。例：「○○は私の白なので今日は△△投票に合わせてほしい。」
    {% elif role.value == 'MEDIUM' -%}
    - 霊媒結果は1日がスタートしてすぐに村へ白黒表現で簡潔に表明してください。例：「サンドラ白」
    - 対抗がいない場合、霊媒師は村の進行を担います。1日目の議論では占い師や狂人および彼らから占われた者を除いたグレーの人から怪しい人を処刑するよう村へ指示してください。
    - 議論から人狼陣営を特定し、村が誰に投票すべきかを統一させるためにリードして投票を指定してください。
    {% elif role.value == 'BODYGUARD' -%}
    - 議論では自分の役職はなるべく隠し、村からの疑いが集まりすぎた場合に役職COしましょう。
    - 護衛の優先順位（必ず守ること）:
      1. CO済みで唯一の霊媒師
      2. 真占い師の可能性が最も高い者
      3. 確定白・強白と見なされた者
      4. 狼に噛まれやすいと判断される村の中核
    - 理由なしにグレー位置を護衛することは禁止。グレー護衛を選ぶ場合は以下をすべて満たすこと: 複数の村人から白視されている・狼が噛む動機が明確・役職護衛より収益が高い。
    {% elif role.value == 'POSSESSED' -%}
    - 占い師を騙って議論を混乱させるのが狂人の役目です。
    - 騙り結果は{{ max_chars }}文字以内で「結果＋理由」を出してください。例：「占いCO。ユミ白。疑い集中を確認した。」
    - 真占い師の信用を落とす疑い先を残し、村の判断を誤誘導してください。
    - 黒出し前に必ず以下のリスクフィルターを通すこと:
      1. その人物が村吊りを強く推進した → 黒を出さない（狼陣営の可能性）
      2. その人物が自分の騙り結果を支持した → 黒を出さない
      3. 真占いが直前に噛まれた → 自分の信頼度が下がっているため新規の黒は出さない
      4. 危険と判断した場合は「今日自分が吊られても情報整理になる」と主張し狼本体を守ること
    {% else -%}
    - 進行役(霊媒師であることが多い)がいる場合は彼に従い、#4の思考のガイドラインにしたがって怪しい人物を探してください。
    {% endif %}
    {% endif %}

    {% if role_skill_text %}
    # 3.5 役職Skills ({{ role.value }})
    {{ role_skill_text }}
    {% endif %}

    # 4. 思考のガイドライン
    - 各プレイヤーの推理に矛盾がないか、抜けがないかを評価し、指摘してください。
    - 「Aさんが人狼なら、相方は誰か？」という仮説を常に2組以上立て、発言の整合性を比較せよ。
    - 情報が不足している場合、相対的に「最も村人らしい/疑わしい」人物を比較・選定してください。
    - 特定の人物に非難が集中した際、**「真っ先に非難を始めたのは誰か？」と「それに便乗した者は誰か？」**を特定せよ。人狼は自分たちが目立たないよう、村人の疑念に「便乗」して票をまとめる傾向がある。

    # 5. 議論姿勢
    - 議論が白熱することを恐れないでください。
    -「みんなで考えよう」のような具体的なアクションを起こさない発言は禁止です。
    - 今日の投票で処刑すべき人物を積極的に考えてください。

    # 6. 発話ルール（必ず守ること）
    - 発言は {{ max_chars }}文字以内に収めてください。
    - 発言に **半角カンマ「,」を含めない**でください。
    - 顔文字・絵文字・句読点以外の記号は使用しないでください（音声読み上げ対応のため）。
    - 特定の人物に話しかける場合は **@名前** のメンション形式を使えます（メンション1つにつき最大{{ max_chars }}文字まで追加で使用可能）。
    - **禁止フレーズ**: 「放置損」「盤面整理」「第一候補は」を同一ゲーム内で連続2回以上使用しない。
    - 毎回の発言に必ず以下のいずれか1つの具体的事実を含めること: 「誰が第何回に何を言ったか」「誰が誰に投票したか」「誰が噛まれたか」。

  initialize: |-
    ### フェーズ: 初期化
    - 指示: ここでは発言しないでください。
    - 出力: <action>Over</action> を出力して準備完了としてください。

  daily_initialize: |-
    フェーズ: 昨夜から今朝にかけての状況報告
    ## {{ info.day }} 日目の朝
    {% if info.divine_result %}・占い結果: {{ info.divine_result }}{% endif %}
    {% if info.medium_result %}・霊媒結果: {{ info.medium_result }}{% endif %}
    {% if info.day <= 1 %}
    ### 指示
    - ここではまだ発言しないでください。
    - 必ず <action>Over</action> と出力して待機してください。
    {% else %}

    {% if info.executed_agent %}・昨日の追放者: {{ info.executed_agent }}{% else %}・昨日の追放者: なし{% endif %}
    {% if info.attacked_agent %}・昨夜の襲撃被害: {{ info.attacked_agent }}{% else %}・昨夜の襲撃被害: なし{% endif %}

    {% if info.vote_list %}・昨日の夕方の投票内訳: {{ info.vote_list }}{% endif %}

    ## 現在の生存者:
    {% for k, v in info.status_map.items() if v == 'ALIVE' %}
    - {{ k }}
    {% endfor %}
    {% endif %}

  talk: |-
    ### フェーズ: 議論への発言
    {% set my_today_count = talk_history | selectattr('day', 'equalto', info.day) | selectattr('agent', 'equalto', info.agent) | list | length %}
    {% set max_talk_count = sent_talk_count + (info.remain_count if info.remain_count is not none else 0) %}
    {% set remain_count = info.remain_count if info.remain_count is not none else 0 %}                                                                                                                                                                                                                                                       
    {% if info.day == 0 and my_today_count == 0 %}                                                                                                                                                        
    ### 指示: 0日目・1回目の発言                                                                                                                                                                          
    - これからゲームが始まります。ゲーム参加者に挨拶と自己紹介をしてください。 
    - ただし、人狼ゲームの自分の役職に関する情報はまだ隠しておくこと。                                                                                                                                                                 
    - 出力形式:
    <thinking>
    [私のアイデンティティから、どのような口調や語尾にすべきか]
    </thinking>
    <action>
    [実際の挨拶内容（{{ max_chars }}文字以内・半角カンマ禁止）]
    </action>                                                                                                                                                  
                                                                                                                                                                                                            
    {% elif info.day == 0 and my_today_count >= 1 %}
    ### 指示: 0日目・2回目以降
    ターン情報: {{ my_today_count + 1 }}回目の発言 / 最大{{ max_talk_count }}回 (残り{{ remain_count }}回)
    - これ以上発言する必要はありません。
    - 必ず <action>Over</action> とだけ出力してください。

    {% elif info.day >= 1 and my_today_count == 0 %}
    ## {{ info.day }}日目の朝・最初の発言ターン

    {% set new_talks = talk_history[sent_talk_count:] %}
    {% if not new_talks %}
    まだ誰も発言していません。
    {% else %}
    すでに以下の発言がなされています。
    {% for w in new_talks %}
    {{ w.agent }}: {{ w.text }}
    {% endfor %}
    {% endif %}

    ### 指示
    ターン情報: {{ my_today_count + 1 }}回目の発言 / 最大{{ max_talk_count }}回 (残り{{ remain_count }}回)
    - この最初の発言ターンでは、**霊媒師COまたは占いCOおよび占い結果の通達がある場合のみそれを提示してください。**
    - 霊媒師CO、占いCO・占い結果の通達がない場合でも、挨拶だけで終えないでください。
    - **「おはよう」「おはようございます」などの汎用的な挨拶は禁止です。**
    - {{ max_chars }}文字以内で「挨拶（任意）＋今日見る観点を1つ」を添えてください。例：「今日は票とCO順を見る。」

    ### 出力形式:
    <thinking>
    [霊媒師CO、占いCO・占い結果を通達すべきか否か、その理由。通達しない場合は前日の状況を踏まえて今日の注目観点を考える]
    </thinking>
    <action>
    [霊媒師CO or 占いCO+結果、または「挨拶＋今日の観点1つ」（{{ max_chars }}文字以内・半角カンマ禁止・「おはよう」系禁止）]
    </action>

    {% else %}
    ### 発言リクエスト ({{ info.day }}日目での発言)
    ターン情報: {{ my_today_count + 1 }}回目の発言 / 最大{{ max_talk_count }}回 (残り{{ remain_count }}回)

    前回以降の新着会話:
    {% set new_talks = talk_history[sent_talk_count:] %}
    {% if new_talks %}
      {% for w in new_talks %}
      {{ w.agent }}: {{ w.text }}
      {% endfor %}
    {% else %}
      （新しい発言はありません。）
    {% endif %}

    ### 指示
    - あなたの発言はこの続きとして他エージェントに発信されます。
    - 前回以降の新情報（占い結果・霊媒結果・新たな発言）を確認してください。
    - 新情報がなければ疑い先を変えないでください。
    - 新情報があれば、その情報名を理由に入れてください。
    - 自分への質問があれば最優先で答えてください。
    - 複数人が同じ吊り候補に集まった場合は発言前に「集火前反証検査」を行うこと:
      1. その候補の具体的な狼要素は何か？
      2. その候補が村人だった場合、誰が最も便乗狼に見えるか？
      3. 他に優先すべき処理対象はないか？
      4. 自分はその投票結果に責任を取れるか？
    - 自分が疑われている場合は「自救発言」として以下を必ず含めること:
      1. 相手の疑い点を一度認める
      2. より強い狼要素を持つ具体的な人物・発言を引用する
      3. その人物の発言変遷を示す
      4. 疑い返しではなく証拠ベースの投票先として提示する
    - **Over禁止局面**: 終盤（Day3以降）・役職が噛まれた直後・判定割れ中は内容なしのOverは禁止。その場合も「現在の第一吊り候補・保留疑点・票割れ時の集約先」を出力すること。
    - 「戦略ガイドライン」および「今日の議論の進め方」を参考に、以下の出力形式に則って出力してください。

    ### 出力形式:
    発言したい内容がある時:
    <thinking>
    [集火前反証検査または自救発言が必要か確認した上で、私{{ info.agent }}（{{ role.value }}）が発言すべき内容]
    </thinking>
    <action>
    [実際の発言内容（{{ max_chars }}文字以内・半角カンマ禁止・@名前でメンション可・具体的事実を1つ含む）]
    </action>

    Over禁止局面を除き、これ以上発言する必要がない時のみ:
    <action>Over</action>

    ### 今日の議論の進め方
    {% if info.day == 1 %}
    - 最初の発言では役職COおよび占い結果、それ以外は挨拶をするよう指示しているので挨拶の仕方等は考察から外すこと。
    - 占いCOをするのは真占い師および狂人の2名であるが、人狼がCOすることもある。占い師COが2人以下の場合は真占い師の精査よりも、グレーの精査による狼探しを優先すること。
    - 占い師COが2人以下の場合は真占い師の精査よりも、グレーの精査による狼探しを優先すること。
    - 占い師COが3人以上の場合は確実に人狼が一人いることになるので、それぞれの視点から見ての推理に矛盾がないか推理し、真偽を決め打ちすること。
    - 霊媒師の能力は夜から発揮されるため初日から霊媒結果を待つ思考は避けてください。
    - 無理に特定の人物を怪しむことはせず、怪しい人がいる場合人狼2人が誰なのかを考察し、根拠とともに提示すること。
    - こじつけた根拠はむしろ怪しまれるが、内容の薄い発言も狼有利となる。
    {% else %}
    - 初日から現在までの全ての死亡者の色を占い結果や霊媒結果から考察し、この議論に人狼が2人いるのか、1人いるのかを考えること。
    - 人狼の可能性があるのは誰なのか、提示された情報を前提に議論におけるラインを見つけて推理すること。
    - 占い判定割れが発生した場合は自動的に黒判定者を吊らないこと。以下を比較してから判断する:
      1. 黒出し占いの前日疑いは一貫しているか？
      2. 黒理由は具体的か（「早い」「集約が強い」だけは弱い根拠）？
      3. 白出し占いの行動と主張は一致しているか？
      4. 霊媒師は生存しているか？（死亡時は鑑定ミラー不可）
      5. 黒者を吊ることで真に有効な情報が得られるか？
      → 霊媒死亡かつ黒理由が弱い場合は偽占い処理を優先する。
    {% endif %}
    {% if info.day >= 3 %}
    ### 終盤の必須計算（生存者5名以下）
    発言前に必ず以下を計算してから発言すること:
    - 現在の最大狼数は何人か？
    - 狂人が生存している可能性があるか？
    - 今日狂人を吊ると狼が過半数になるか？ → なるなら絶対に狼本体を吊ること
    - 今日の最優先は「狼を吊る」か「偽役職を処理する」かを明示して発言する
    {% endif %}
    - 真が確定した霊媒師などの村のリーダーは3回目の発言あたりで、票集約を「対象＋理由」で短く提案してください。命令だけの固定は禁止です。例：「票割れ回避でリン。転換理由が薄い。」
    - 真が確定した霊媒師以外は霊媒師や他人に推理を求めるのではなく自ら積極的に推理すること。
    {% endif %}

  whisper: |-
    ### フェーズ: 人狼同士の囁き会話
    {% set day0_talks = talk_history | selectattr('day', 'equalto', 0) | list %}
    {% set max_whisper_count = sent_whisper_count + (info.remain_count if info.remain_count is not none else 0) %}
    {% set remain_whisper_count = info.remain_count if info.remain_count is not none else 0 %}

    {% if info.day == 0 and day0_talks | length == 0 %}
    ### 指示: 0日目・1回目の囁き（自己紹介前）
    - まだ自己紹介フェーズが始まっていません。ここでは囁かないでください。
    - 必ず <action>Over</action> とだけ出力してください。

    {% elif info.day == 0 and day0_talks | length > 0 %}
    ### 指示: 0日目・2回目の囁き（自己紹介後）
    ターン情報: {{ sent_whisper_count + 1 }}回目の囁き / 最大{{ max_whisper_count }}回 (残り{{ remain_whisper_count }}回)
    - 自己紹介フェーズが終わりました。仲間の人狼と1日目以降の戦略を相談してください。
    - 初期方針を相談して決めてください。基本的には狂人が占い師を騙るのがテンプレートです。

    前回以降の新着囁き:
    {% set new_whispers = whisper_history[sent_whisper_count:] %}
    {% if new_whispers %}
      {% for w in new_whispers %}
      {{ w.agent }}: {{ w.text }}
      {% endfor %}
    {% else %}
      （新しい囁きはありません。あなたが最初の発言者です。）
    {% endif %}

    ### 出力形式:
    <thinking>
    [1日目以降に向けた初期戦略]
    </thinking>
    <action>
    [仲間へのメッセージ（{{ max_chars }}文字以内・半角カンマ禁止）]
    </action>

    {% else %}
    ### 囁きリクエスト ({{ info.day }}日目での囁き)
    ターン情報: {{ sent_whisper_count + 1 }}回目の囁き / 最大{{ max_whisper_count }}回 (残り{{ remain_whisper_count }}回)

    前回以降の新着囁き:
    {% set new_whispers = whisper_history[sent_whisper_count:] %}
    {% if new_whispers %}
      {% for w in new_whispers %}
      {{ w.agent }}: {{ w.text }}
      {% endfor %}
    {% else %}
      （新しい囁きはありません。）
    {% endif %}

    ### 指示
    - 昼の議論を踏まえ、仲間の人狼と戦略を調整してください。
    - 誰を次の標的にするか、誰を庇うかなどを相談してください。

    ### 出力形式:
    囁きたい内容がある時:
    <thinking>
    [仲間の人狼と共有すべき戦略・情報]
    </thinking>
    <action>
    [仲間へのメッセージ（{{ max_chars }}文字以内・半角カンマ禁止）]
    </action>

    これ以上囁く必要がない時:
    <action>Over</action>
    {% endif %}

  daily_finish: |-
    ### フェーズ: 1日の終わり
    - 指示: ここでは発言しないでください。
    - 出力: <action>Over</action> を出力して準備完了としてください。

  divine: |-
    ### フェーズ: 占い

    ### 占いリクエスト (占い師専用)
    今夜占う(人狼かそうでないかがわかる)対象を一人選んでください。対抗の占い師は狂人であることが多いため、狼を探す目的からは外れることが多い。
    自分以外の生存している対象:
    {% for k, v in info.status_map.items() if v == 'ALIVE' and k != info.agent %}
    - {{ k }}
    {% endfor %}

    ### 出力形式:
    <thinking>
    [各候補者の分析:]
    {% for k, v in info.status_map.items() if v == 'ALIVE' and k != info.agent %}
    - {{ k }}: [考察]
    {% endfor %}
    [最終的な判断理由:]
    </thinking>
    <action>[対象のエージェント名のみを出力]</action>

  vote: |-
    ### フェーズ: VOTE

    投票リクエスト
    追放（処刑）したいプレイヤーを一人選んでください。

    自分以外の生存者リスト:
    {% for k, v in info.status_map.items() if v == 'ALIVE' and k != info.agent %}
    - {{ k }}
    {% endfor %}

    ### 出力形式:
    <thinking>
    [各候補者の分析:]
    {% for k, v in info.status_map.items() if v == 'ALIVE' and k != info.agent %}
    - {{ k }}: [印象や考察]
    {% endfor %}
    [誰を処刑するべきかの考察:]
    </thinking>
    <action>[対象のエージェント名のみを出力]</action>

  attack: |-
    ### フェーズ: 人狼の襲撃

    襲撃リクエスト (人狼専用)
    今夜襲撃するプレイヤーを一人選んでください。

    襲撃可能な生存者候補:
    {% for k, v in info.status_map.items() if v == 'ALIVE' and k != info.agent %}
    - {{ k }}
    {% endfor %}

    ### 指示
    - 仲間の人狼は襲撃しないでください。
    - 真役職（真占い師・真霊媒師）、確定白、発言力の強い村人を優先してください。

    ### 出力形式:
    <thinking>
    [戦略的分析: 仲間の人狼を除外した上で優先順位を判断する]
    </thinking>
    <action>[対象のエージェント名のみを出力]</action>

log:
  console_output: true
  file_output: true
  output_dir: ./log
  level: debug
  request:
    name: false
    initialize: false
    daily_initialize: false
    whisper: true
    talk: true
    daily_finish: false
    divine: true
    guard: true
    vote: true
    attack: true
    finish: false
